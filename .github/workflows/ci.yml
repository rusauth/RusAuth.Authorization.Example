name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

env:
  DOTNET_VERSION: 10.0.302
  BUILD_CONFIGURATION: Release
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/rusauth-authorization-example
  PUBLISH_OUTPUT: artifacts/publish
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

concurrency:
  group: example-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore solution
        run: dotnet restore RusAuth.Authorization.Example.slnx --nologo

      - name: Build solution
        run: dotnet build RusAuth.Authorization.Example.slnx -c ${{ env.BUILD_CONFIGURATION }} --no-restore --nologo

      - name: Run tests
        run: dotnet test RusAuth.Authorization.Example.slnx -c ${{ env.BUILD_CONFIGURATION }} --no-build --nologo --logger "console;verbosity=minimal"

      - name: Publish application
        run: dotnet publish RusAuth.Authorization.Example/RusAuth.Authorization.Example.csproj -c ${{ env.BUILD_CONFIGURATION }} --no-build --nologo -o ${{ env.PUBLISH_OUTPUT }}

      - name: Verify Blazor framework assets
        shell: pwsh
        run: |
          $frameworkScript = Join-Path '${{ env.PUBLISH_OUTPUT }}' 'wwwroot/_framework/blazor.web.js'
          if (-not (Test-Path $frameworkScript)) {
            throw "Expected Blazor framework script was not published: $frameworkScript"
          }

      - name: Upload published application
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: ${{ env.PUBLISH_OUTPUT }}
          if-no-files-found: error

  publish-image:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download published application
        uses: actions/download-artifact@v4
        with:
          name: published-app
          path: ${{ env.PUBLISH_OUTPUT }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.runtime
          load: true
          tags: rusauth-example:smoke-${{ github.sha }}

      - name: Smoke-test container health contract
        shell: bash
        run: |
          set -euo pipefail
          container_name="rusauth-example-smoke-${GITHUB_RUN_ID}"
          docker run --detach \
            --name "${container_name}" \
            --publish 18080:8080 \
            --publish 18081:8081 \
            --env ASPNETCORE_ENVIRONMENT=Development \
            --env 'ASPNETCORE_URLS=http://+:8080;http://+:8081' \
            --env HealthChecks__ManagementPort=8081 \
            --env RusAuth__Token=container-smoke-token \
            --env Example__CallbackBearerToken=container-smoke-callback \
            "rusauth-example:smoke-${GITHUB_SHA}" >/dev/null
          trap 'docker rm --force "${container_name}" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18081/health/ready >/dev/null; then
              break
            fi
            if [[ "${attempt}" -eq 30 ]]; then
              docker logs "${container_name}"
              exit 1
            fi
            sleep 2
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/health/ready)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/swagger/index.html)" = "404"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.runtime
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
